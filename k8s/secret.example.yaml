# Example only — do not commit a filled-in copy of this file.
#
# Create the real secret imperatively instead, e.g.:
#   kubectl create secret generic gdrive-s3-gateway \
#     --from-file=rclone.conf=./rclone.conf \
#     --from-literal=access-key-id=CHANGE-ME \
#     --from-literal=secret-access-key=CHANGE-ME
#
# Or seal it with kubeseal if it needs to live in a GitOps repo.
apiVersion: v1
kind: Secret
metadata:
  name: gdrive-s3-gateway
type: Opaque
stringData:
  rclone.conf: |
    [drive]
    type = drive
    client_id = CHANGE-ME
    client_secret = CHANGE-ME
    token = {"access_token":"CHANGE-ME","token_type":"Bearer","refresh_token":"CHANGE-ME","expiry":"CHANGE-ME"}
  access-key-id: CHANGE-ME
  secret-access-key: CHANGE-ME
